tasks:
  - id: 1
    description: >-
      Add pure, deterministic catalog projections for registered parent tools and loaded skills: normalize and bound searchable metadata, redact source identity, omit every parameter schema/body/policy/input value, rank ties stably, and reject activation names not returned by the current tool search.
    verify: node --test extensions/context-router/catalog.test.ts
    status: failing
    risk: P0
    security: high
    security_verification: >-
      Prove bounded results contain no tool parameters, raw source path, skill body, raw policy, tool input, token, credential-shaped value, or control-character injection; prove ranking is deterministic.
    tdd:
      red: A compilable catalog helper returning raw or unbounded metadata fails redaction, bounds, deterministic tie-order, and selected-match-only assertions.
      green: The projection returns only the documented safe fields and stable rankings without inspecting tool schemas at result rendering time.
    allure:
      severity: critical
      categories: ["Catalog routing", "Information disclosure", "Deterministic ranking"]

  - id: 2
    description: >-
      Register find_tools and find_skills, maintain one parent-session coordinator, establish the exact startup baseline, and reapply baseline plus selected names at turn_start so late unselected registration disappears before the next model request while finder-driven additions remain purely additive.
    verify: node --test extensions/context-router/index.test.ts
    status: failing
    risk: P0
    security: high
    security_verification: >-
      Prove the baseline is exactly the registered intersection of read/bash/edit/write/grep/find/ls/subagent/find_tools/find_skills, subagent_result and unselected MCP/custom tools are inactive, selections do not activate unmatched names, and no new security findings exist in active-tool lifecycle paths.
    tdd:
      red: A compilable router stub that preserves Pi's full or late-auto-activated set fails startup, turn-start, additive-selection, unregister, and shutdown-isolation assertions.
      green: The coordinator uses only documented Pi APIs, resets only between turns, and preserves selected registered names across the parent session.
    allure:
      severity: critical
      categories: ["Dynamic tool loading", "Late registration", "Parent session isolation"]

  - id: 3
    description: >-
