    verify: node --test extensions/context-router/prompt.test.ts
    status: failing
    risk: P0
    security: high
    security_verification: >-
      Prove exact-one replacement alone reduces prompt bytes, zero/multiple matches are fail-safe, explicit /skill:name remains on Pi's expansion path, and no skill body or unrelated prompt text reaches finder/debug output.
    tdd:
