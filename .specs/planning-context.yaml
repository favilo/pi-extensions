feature_name: full_rust_pi_event_orchestration
problem_statement: >-
  The existing Rust/WASM registration layer can call pi.on, registerCommand, and
  registerEntryRenderer, but it forwards every Pi event to named TypeScript
  bridge handlers. Therefore, extensions/tool-permissions/index.ts still owns
  callback implementations and orchestration, so it cannot be reduced to a
  loader-only entrypoint. Tool-permissions needs a Rust-owned event orchestration
  layer that directly registers and implements all callbacks.
constraints:
  - Pi package entry remains extensions/tool-permissions/index.ts. It only loads the WASM module and passes Pi to one Rust initialization export; it implements no callbacks or permission behavior.
  - Rust calls pi.on, registerCommand, and registerEntryRenderer and owns every registered callback implementation.
  - Rust-created callback adapters use supported safe napi-rs APIs and capture only owned Rust-managed state. Do not use unsafe code to extend a callback, Env, or JavaScript-value lifetime.
  - Do not retain borrowed Env, Object, Function, FunctionRef, or other JavaScript values across callback boundaries or asynchronous suspension. Convert event inputs to owned Rust domain types at callback entry.
  - The first migration story is a blocking spike that proves Rust callbacks remain callable after initialization, safely settle required asynchronous work, clean up at shutdown, and validates the pure Rust state/lifetime design under Miri where applicable.
  - No TypeScript permission fallback after the last story. A missing or invalid WASM module fails closed.
  - Do not reopen or rewrite passing e16 stories. Their non-goals stay historical.
  - NAPI-RS target remains wasm32-wasip1-threads. The flavor id remains wasm32-wasi. wasm32-unknown-unknown is not a supported target.
  - Rust calls Pi for terminal UI, editor widgets, and tool execution. The WASM module does not spawn a shell or open a network of its own.
  - Version control is Jujutsu. Do not push the active e16 bookmark. Do not discard the uncommitted WASM packaging changes in this working copy.
out_of_scope:
  - Rewriting passing e16 stories
  - Deleting extensions/tool-permissions/index.ts
  - Porting extensions other than tool-permissions
  - Changing permission rule syntax, save shortcuts, or user-visible prompt semantics
  - Replacing Pi's TUI or tool runtime inside the WASM module
  - Retaining TypeScript callback handlers or a TypeScript bridge object
  - Unsafe pointer, static-lifetime, or callback-lifetime workarounds
key_decisions:
  - decision: Add epic e18 after e17 instead of editing e16.
    rationale: e16 is passing and its non-goals require the TypeScript host boundary this epic removes.
  - decision: One epic moves all five host areas, then removes the TypeScript fallback.
    rationale: The user called each missing host area important, and a fallback cannot be removed until those areas have a WASM owner.
  - decision: Rust owns control flow and calls host-supplied Pi APIs.
    rationale: A one-line TypeScript loader is the realistic Pi entry. WASM does not reimplement the terminal or process runtime.
  - decision: Re-evaluate pi-oxidized and pi-oxidized-ext in e18s00 before moving host areas.
    rationale: crates.io publishes pi-oxidized as the Rust Pi product and pi-oxidized-ext as the extension-host crate that exposes pi_ext. pi-oxided is only a misspelling in older e16 text. e18s00 records adopt or reject. Later stories follow that record.
  - decision: Reject pi-oxidized-ext and keep the standalone NAPI package, with private pi-api as the ExtensionAPI helper.
    rationale: pi-oxidized 0.1.1 is the product runtime. pi-oxidized-ext 0.1.1 is a Bun JSONL host client and cannot register pi.on from Rust. .specs/epics/archive/e18-wasm-only-tool-permissions/e18s00-pi-oxidized-decision.md records decision reject. Later stories call Pi through extensions/tool-permissions/native/crates/pi-api.
  - decision: Earlier stories keep load-failure fallback until e18s06.
    rationale: Each host area can ship on the WASM success path while the extension still starts if that area's module call fails. e18s06 deletes that fallback.
  - decision: Create a follow-on full-Rust Pi-event orchestration epic before completing e18s06 task 3.
    rationale: Existing Rust registration calls pi.on but forwards every event to TypeScript handlers, so task 3 cannot truthfully make index.ts loader-only.
  - decision: Start the orchestration epic with a safe callback-lifetime spike.
    rationale: The Rust registration mechanism must prove that Rust-created callbacks can outlive initialization, perform required asynchronous work, and clean up safely without unsafe lifetime extension before behavior is migrated.
  - decision: Use safe napi-rs callback adapters with typed Rust orchestration state.
    rationale: The adapters are boundary plumbing only; they capture owned Rust state and use the invocation callback context for transient JavaScript values. TypeScript contains no callback behavior.
