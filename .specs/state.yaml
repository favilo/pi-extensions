  next_skill: develop-tdd
  context: 'User accepted e19s01 and approved the following direction for e19s02,
    but requested implementation start next session. Use Rust async/await with napi::Promise<PromptQueueResolution>
    and a single FIFO queue. Investigate napi-async-runtime 0.2.10 (Tokio-free), preferably
    CurrentThread, with napi''s async-runtime feature and generated WASI loader host
    bootstrap (napi.wasm.asyncRuntime: true and @napi-rs/async-runtime). Register
    the runtime through module_init. Declare Rust dependencies under workspace.dependencies
    and member dependencies with workspace = true. Confirm compatible napi-derive
    and npm package versions before changing dependencies.


    Use a ThreadsafeFunction with call_async_catch to invoke the presenter on its
    owning JavaScript thread; await the callback invocation and then the returned
    typed Promise. Do not retain Env or borrowed JavaScript handles across suspension.
    Do not block_on the Pi JavaScript thread. Preserve single-queue FIFO, identity
    binding, cancellation, shutdown, and fail-closed behavior. Test synchronous throws,
    rejected and malformed results, cancellation, teardown, and the real WASM loader.
    Keep runtime bootstrap separate from production TypeScript permission callback
    glue. TypeScript currently calls decidePrompt through native-prompt-queue.ts;
    production migration is later e19 work.


    Current committed state: presenter FunctionRef transmute was removed; a typed
    PromiseRaw<''static, ...> signature marker remains and is narrowed to invocation
    lifetime. Raw deferred handles and unsafe impl Send were replaced with napi::JsDeferred;
    the queue remains process-global and uses an environment cleanup hook. Generated
    TypeScript declares Promise<PromptQueueResponse>. Workspace Clippy all and pedantic
    are warnings; undocumented_unsafe_blocks is denied and npm run check runs Clippy.
    e19s02 remains in progress, not complete. Miri passed Rust-owned queue tests only;
    it does not validate N-API or JavaScript environment lifetimes. The story and
    task ledger reflect the user''s updated direction; do not claim Miri proves host-lifetime
    safety.


    Prior art: local napi 3.16.2 promise.rs and threadsafe_function.rs; napi-async-runtime
    0.2.10 src/lib.rs, src/adapter.rs and src/js_callback.rs in the Cargo registry;
    https://napi.rs/docs/concepts/async-runtime and https://docs.rs/napi-async-runtime/0.2.10/napi_async_runtime/.
    CurrentThread on WASM needs loader task and timer hosts; the runtime crate does
    not install itself. The user''s desired approach does not require Tokio.


    Follow repository TDD: behavioral RED and GREEN in separate jj changes; run tests
    and jj commit in separate Bash calls. No raw git commands. No push unless asked.
    Keep working directory at project root for Bigpowers scripts and invoke them only
    via $BIGPOWERS_ROOT/scripts absolute path.'
  blocker: 'The account-switcher subagent model issue is investigated and tracked
    as BUG-2026-11-20T101309; its fix is separate follow-up work. Resume e19s02. User
    approved aligning the native package''s Node compatibility with the new @napi-rs/async-runtime
    0.2.0 dependency: ^20.19.0 || ^22.13.0 || >=23.5.0. The updated Bigpowers RED
    isolation checker passed for daeca6da using an isolated jj workspace and the project''s
    installed dependencies. npm audit reports three pre-existing high findings in
    brace-expansion, undici, and zod; none are dependencies of the new host package.
    cargo audit found no Rust dependency vulnerabilities.'
  async_runtime_progress: The plan consistency checker now passes after adding missing
    spec links to six task ledgers. The behavioral RED commit daeca6da fails against
    the earlier stub with an assertion that the Rust tracer must return a Promise.
    The committed GREEN bootstraps napi-async-runtime 0.2.10 with the generated WASI
    loader and @napi-rs/async-runtime 0.2.0. The focused eight-test suite, full npm
    run check (374 preflight and 34 Rust tests), and cargo audit pass. Queue migration
    and lifecycle tests remain; task 1 is passing. No push was performed.
  current_async_draft: RED a5a20081 passed the updated jj-aware isolation checker.
    Committed change 6f8108fa uses a mutex-owning environment registry, unique prompt
    IDs, and typed ThreadsafeFunction dispatch. Full npm run check now passes (375
    TypeScript tests and 35 Rust tests) after replacing synchronous presenter assumptions
    in existing tests with explicit readiness signals. A temporary /tmp/pi-wasi-prompt-lifecycle.cjs
    probe observed the same numeric env address across independent WASM instances
    and tested disposal with a pending prompt and late allow; same-registry reuse
    was simulated in Rust. The probe is not yet a committed regression test, and the
    registry test was added alongside implementation rather than independently RED.
    Shutdown, cancellation, malformed resolutions, cleanup ordering, cross-environment
    isolation, and a full security review remain before claiming the story done. Resume
    e19s02 after investigating the child-model bug. Task 2 remains failing until those
    identity and security contracts are verified; tasks 3 and 4 also remain failing.
    Next use develop-tdd for the lifecycle cases, then run verify-work and security
    review. The separate path wording fix is ce5d4810, with RED 1b230149. Its broader
    original report remains unconfirmed; registry BUG-2026-11-19T165747 stays open
    pending real reproduction and edit/write parity investigation. No push or PR was
    made.
