  - path: .specs/PI_EXTENSIONS_MIGRATION.md
    purpose: Existing package boundary and historical decision to keep Codex MCP local
  - path: .specs/state.yaml
    purpose: Current project state showing that no epic or story is active
  - path: package.json
    purpose: Current explicit shared-extension package surface
  - path: README.md
    purpose: Current private package distribution and extension documentation
  - path: ~/.pi/agent/extensions/mcp.ts
    purpose: Existing coupled MCP status command to be made shareable
  - path: ~/.pi/agent/extensions/codex-mcp.ts
    purpose: Existing machine-local provider that must adopt the registry contract

story_mapping_note: >-
  No project epics or stories existed when this scope was written. The e01s01,
  e01s02, e01s03, and e01s04 identifiers are provisional traceability reservations
  for slice-tasks, not evidence of existing epic capsules or implementation plans.
