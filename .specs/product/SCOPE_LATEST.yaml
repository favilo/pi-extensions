feature_name: directory_local_tool_permissions

core_value: >-
  Let users grant narrowly scoped tool permissions for trusted project directories without weakening permissions elsewhere.

summary: |-
  Extend the existing tool-permissions extension with hierarchical project policy files. A directory may contain `.pi/permissions.toml`; when Pi starts inside a Git or Jujutsu repository, the extension searches from the working directory upward through the nearest repository root. Broad parent policy is considered first, but the nearest matching rule wins. If no project rule matches, evaluation falls back to the existing user policy.

  Project policy is honored only when backed by an explicit persisted Pi trust decision. A trusted parent covers its descendants; a child denial overrides a trusted parent. Configuration above the path covered by the matched trust decision is ignored. For e03, trust provenance is resolved from Pi's user trust store behind an internal abstraction so a future public Pi API can replace that mechanism.

  Permission prompts gain explicit save scopes: Ctrl+A allows and saves the suggested rule to the current directory's `.pi/permissions.toml`, while Ctrl+Shift+A allows and saves it to the existing user configuration. Permission rules remain TOML and separate from Pi's JSON settings.

in_scope:
  - future_epic_id: e03
    outcome: Extend `extensions/tool-permissions/` rather than introduce a replacement extension.
  - future_epic_id: e03
    outcome: Discover `.pi/permissions.toml` from the working directory upward through the nearest `.git` or `.jj` repository root.
  - future_epic_id: e03
    outcome: Resolve matching project rules from broadest to nearest so the nearest matching decision wins, then fall back to user policy when no project rule matches.
  - future_epic_id: e03
    outcome: Honor project policy only under the path covered by the nearest explicit persisted Pi trust decision.
  - future_epic_id: e03
    outcome: Save an allowed rule to the current directory's project policy with Ctrl+A.
  - future_epic_id: e03
    outcome: Save an allowed rule to user policy with Ctrl+Shift+A.
  - future_epic_id: e03
    outcome: Make the active save scope and destination clear in prompt hints and completion feedback.
  - future_story_id: e03s03
    outcome: Support `/permissions user` and trust-gated `/permissions local`, while preserving bare `/permissions` as the user-policy editor.
  - future_epic_id: e03
    outcome: Isolate trust resolution behind a replaceable interface so a future supported Pi API can supersede direct trust-store reading.

out_of_scope:
  - item: Changing Pi core or the native `pi config` command
    reason: The capability extends the repository's existing tool-permissions extension and should not require a Pi fork.
    disposition: excluded
  - item: Integrating permission rules into Pi's JSON settings
    reason: Pi exposes no extension settings namespace, its generic array merge does not provide rule-level precedence, and TOML is preferred for manually edited permission rules.
    disposition: rejected_for_e03
  - item: Searching for project policy above the nearest `.git` or `.jj` repository root toward `$HOME`
    reason: Broader hierarchical overrides may be useful, but their boundaries and interaction with user-global policy require separate design.
    disposition: deferred
  - item: Loading project policy without an explicit persisted Pi trust decision
    reason: Repository-controlled allow rules could otherwise silently authorize commands on the user's machine.
    disposition: prohibited
  - item: Treating session-only trust or one-run CLI approval as persisted trust
    reason: Pi's public extension context exposes only a boolean and does not expose the matched trust path or provenance needed for safe ancestor policy loading.
    disposition: deferred_until_supported
  - item: Changing Ctrl+E pattern-editing behavior
    reason: The requested interaction changes direct allow-and-save shortcuts; scoped pattern editing can follow after the storage model is proven.
    disposition: deferred
  - item: Migrating existing user permission rules automatically
    reason: Existing user policy remains readable without destructive format migration.
    disposition: excluded
  - item: Changing audit-log scope or retention
    reason: Permission resolution changes do not require separate project audit logs.
    disposition: retained_existing_behavior

constraints:
  behavioral:
    - Within one policy file, deny rules retain precedence over allow rules.
    - Across project policy files, the nearest matching decision wins.
    - Any matching project decision wins over a conflicting user-level decision.
    - If no project policy matches, evaluation falls back to user-level policy.
    - Search includes the working directory and stops after the nearest directory containing `.git` or `.jj`.
    - Outside a Git or Jujutsu repository, only the working directory is eligible for project policy in e03.
  trust:
    - Resolve the nearest persisted Pi trust decision for the working directory.
    - A persisted trusted parent covers descendant directories unless a nearer persisted denial applies.
    - Ignore candidate policy files above the path named by the matched trusted entry.
    - Missing, denied, malformed, or unreadable trust data disables project policy without weakening user policy.
    - Direct trust-store access must be encapsulated so its implementation can be replaced without changing permission evaluation.
  security:
    - Missing project policy is ignored, but an eligible malformed or unreadable project policy forces an interactive warning prompt and blocks in non-interactive modes.
    - A failed save must not report success or allow a call as though persistence succeeded.
    - Canonicalize paths before trust-boundary, repository-boundary, and precedence comparisons.
  compatibility:
    - Existing `~/.config/pi/config.toml` permission rules continue to work without manual migration.
    - Interactive and non-interactive permission behavior remains unchanged when no eligible project policy exists.
    - Use Pi's exported `CONFIG_DIR_NAME` rather than hardcoding `.pi` in implementation, while documenting `.pi` as the default user-facing path.
  product:
    - Keep permission configuration in dedicated TOML files.
    - Keep configuration understandable and manually editable.

success_criteria:
  - future_epic_id: e03
    criterion: A rule in the current directory overrides a conflicting rule in a parent project policy file.
  - future_epic_id: e03
    criterion: A matching trusted parent rule applies to descendant working directories through the repository root.
  - future_epic_id: e03
    criterion: A project allow overrides a conflicting user deny, and a project deny overrides a conflicting user allow.
  - future_epic_id: e03
    criterion: A call without a matching project rule receives the existing user-level decision.
  - future_epic_id: e03
    criterion: Policy above the repository root or above the matched trusted path is ignored.
  - future_epic_id: e03
    criterion: A nearer explicit trust denial prevents inherited parent project policy from loading.
  - future_epic_id: e03
    criterion: Missing, malformed, denied, or unreadable trust information disables project policy while preserving user-policy behavior.
  - future_story_id: e03s01
    criterion: An eligible malformed or unreadable project policy produces a warning prompt interactively and blocks the tool call non-interactively.
  - future_epic_id: e03
    criterion: Ctrl+A persists the suggested allow rule to the current directory's project policy, while Ctrl+Shift+A persists it to user scope, and the prompt communicates both choices.
  - future_story_id: e03s03
    criterion: "/permissions user edits user policy, /permissions local edits the eligible current-directory policy, and bare /permissions remains user-scoped."
  - future_epic_id: e03
    criterion: Existing package checks remain green and existing user-only configurations preserve their behavior.

