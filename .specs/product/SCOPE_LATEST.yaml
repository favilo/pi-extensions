research_notes: |-
  ## Prior Art

  **Verdict: extend the existing tool-permissions extension.** No replacement plugin or new package is warranted. The repository already owns rule parsing, deny-before-allow evaluation, atomic TOML patching, prompt rendering, shortcut handling, and focused tests under `extensions/tool-permissions/`.

  Eligible project-policy parse/read failures are distinct from absent policy: they produce a warning prompt in interactive mode and block in non-interactive mode. Trust-store failures instead make project policy ineligible and preserve existing user-policy behavior.

  Pi calls `settings.json`, `extensions`, `skills`, `prompts`, `themes`, `SYSTEM.md`, and `APPEND_SYSTEM.md` under the current `.pi` directory “trust-requiring resources.” Their presence causes Pi to consult saved trust or prompt before loading them. A custom `permissions.toml` is not currently on that list, and Pi does not search ancestor `.pi` directories for these resources.

  Pi's persisted trust store does support nearest-ancestor semantics: the closest explicit true or false decision wins, so a trusted parent covers descendants and a nearer child denial blocks inheritance. The public `ctx.isProjectTrusted()` API exposes only the resulting boolean, not whether it was explicit, which path matched, or whether trust was temporary. E03 therefore starts with a small trust-resolver adapter over the persisted store and fails closed on uncertainty. This dependency is intentionally replaceable.

  Native Pi settings are not adopted for rules. They are JSON, expose no extension namespace through `ExtensionContext`, and use generic object/array merge semantics that do not implement nearest matching rule precedence. Dedicated TOML preserves the existing format and editing behavior.

  Upstream subagent discovery walks ancestors to find the nearest `.pi/agents` directory, while this repository's local-agent-context extension stops traversal at a repository boundary. These are the discovery precedents for e03.
