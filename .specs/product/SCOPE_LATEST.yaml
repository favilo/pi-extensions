feature_name: extension_unit_coverage

core_value: >-
  Protect currently untested Pi extensions with fast, deterministic tests of their public behavior.

summary: |-
  Add unit-level contract coverage for clear-reload, enable-extra-tools, exit, and local-agent-context. Tests exercise each extension through a minimal fake Pi API or isolated temporary filesystem rather than launching Pi.

  This is characterization coverage: existing behavior should remain unchanged unless a test exposes a defect. The package-wide test command must discover the new files automatically.

in_scope:
  - future_story_id: e02s01
    outcome: Cover /clear idle waiting, parent-session handoff, replacement reload, and cancellation notification.
  - future_story_id: e02s01
    outcome: Cover idempotent extra-tool activation and /tools-debug output.
  - future_story_id: e02s01
    outcome: Cover /exit graceful shutdown delegation.
  - future_story_id: e02s01
    outcome: Cover local context discovery order, Git boundary, trimming, empty-file omission, and no-op behavior.

out_of_scope:
  - item: Real Pi process integration tests
    reason: Deferred until unit contracts establish a stable, fast baseline.
    disposition: future_integration_test_epic
  - item: Production behavior changes
    reason: This initiative characterizes existing contracts; defects discovered by tests require an explicit follow-up fix cycle.
    disposition: prohibited_unless_test_exposes_defect
  - item: Tests for already-covered extensions
    reason: Existing tests already cover renderer, cursor, Jujutsu status, permissions, and MCP behavior.
    disposition: retained_existing_coverage

constraints:
  technical:
    - Use Node's built-in test runner and strict assertions.
    - Add no dependency.
    - Use temporary directories for filesystem scenarios and always clean them up.
    - Test public extension behavior rather than private implementation details.
  quality:
    - Tests must be fast, independent, repeatable, self-validating, and timely.
    - npm run check must remain green.

success_criteria:
  - future_story_id: e02s01
    criterion: Each of the four previously untested extension directories contains a focused index.test.ts file.
  - future_story_id: e02s01
    criterion: Focused tests and npm run check pass without network, credentials, or a real Pi process.
  - future_story_id: e02s01
    criterion: Tests cover positive behavior and important no-op or cancellation boundaries.

references:
  - path: package.json
    purpose: Existing test discovery command
  - path: extensions/clear-reload/index.ts
    purpose: Clear-session command contract
  - path: extensions/enable-extra-tools/index.ts
    purpose: Tool activation and debug command contract
  - path: extensions/exit/index.ts
    purpose: Graceful shutdown alias contract
  - path: extensions/local-agent-context/index.ts
    purpose: Local context discovery and prompt augmentation contract
