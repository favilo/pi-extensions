research_notes: |-
  ## Prior Art

  **Verdict: migrate and extend `SeanPedersen/pi-context-skills` into this repository as
  `extensions/context-router/`; do not install it as a package and do not create a Pi skill.**

  The upstream package is an MIT TypeScript Pi extension, version 0.1.0, published 2026-05-26;
  its last source push was 2026-05-27. It provides useful source material: conservative metadata
  parsing/discovery, a skill-section replacement seam, and status rendering. The local migration
  must retain upstream provenance in source/docs but replace its project-persisted LLM selection
  (`.pi/skills-selection.json`) with the requested explicit `find_skills` discovery tool. It must
  use Pi's structured `systemPromptOptions.skills`, thereby including the installed Pi skill sources
  the upstream extension misses and avoiding duplicate filesystem discovery.

  Pi 0.82.1 documents the required supported tool mechanism: register all tools, keep loader tools
  active, and use additive `setActiveTools([...current, ...matches])` during loader execution. Pi
  records additions on the result and provides native deferred definitions for OpenAI GPT-5.4+; the
  configured Codex GPT-5.6 family is eligible. Pi falls back safely to the complete active set on
  providers that do not support deferred loading. `turn_start` is emitted before each model turn,
  and Pi's late `registerTool()` refresh otherwise automatically adds newly registered tools, so the
  extension must reapply baseline plus its session selections at that point.

  Pi's `before_agent_start` exposes both the generated `systemPrompt` and structured loaded skills.
  `formatSkillsForPrompt(skills)` produces the exact canonical block. The migrated helper can replace
  exactly one occurrence of that rendered block with `formatSkillsForPrompt([])`, preserving the
  whole prompt when matching is ambiguous instead of using the upstream substring-oriented approach.
  `/skill:name` expands in Pi's input phase before `before_agent_start`, so no context-router input
  interception is needed.

  Other located projects (`pi-dcp`, `pi-condense`, and `@hypabolic/pi-hypa`) prune or compress
  post-turn context/tool output, not the initial tool-schema and skill-catalog payload. No external
  dependency is proposed.
